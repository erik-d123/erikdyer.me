<style>
  :root {
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --ease-out-expo:  cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: oklch(0.58 0.14 265 / 0.25); }

  button:focus-visible, a:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }

  @keyframes inkFade {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideInR {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes dotPop {
    from { opacity: 0; transform: scale(0.4); }
    to   { opacity: 1; transform: scale(1); }
  }

  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 320ms;
    animation-timing-function: var(--ease-out-quart);
  }
  ::view-transition-old(hero-title),
  ::view-transition-new(hero-title),
  ::view-transition-old(section-dot),
  ::view-transition-new(section-dot),
  ::view-transition-old(section-label),
  ::view-transition-new(section-label),
  ::view-transition-old(nav-active-dot),
  ::view-transition-new(nav-active-dot) {
    animation-duration: 460ms;
    animation-timing-function: var(--ease-out-expo);
    mix-blend-mode: normal;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
      scroll-behavior: auto !important;
    }
  }

  .app-scroll::-webkit-scrollbar { width: 10px; }
  .app-scroll::-webkit-scrollbar-track { background: transparent; }
  .app-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 5px; }
</style>
